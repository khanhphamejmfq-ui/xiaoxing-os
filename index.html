<script>
(function(){
  try {
    var keys = [
      'xiaoxingos_disclaimer_accepted','sullyos_disclaimer_accepted',
      'xiaoxingos_update_seen','xiaoxingos_update_2026_05_seen','xiaoxingos_update_2026_05_10_seen',

      'xiaoxing_update_hidden_forever','sully_update_hidden_forever'
    ];
    keys.forEach(function(k){ localStorage.setItem(k,'true'); sessionStorage.setItem(k,'true'); });
  } catch(e) {}
  function badText(t){
    if(!t) return false;
    t = String(t).replace(/\s+/g,'');
    return (
      (t.indexOf('免责声明')>=0 && (t.indexOf('继续使用')>=0 || t.indexOf('我已知悉')>=0 || t.indexOf('倒卖诈骗')>=0)) ||
      (t.indexOf('小更新提醒')>=0) ||
      (t.indexOf('更新提示')>=0) ||
      (t.indexOf('查看5月10日小更新')>=0) ||
      (t.indexOf('心象')>=0 && t.indexOf('上线')>=0 && t.indexOf('更新')>=0) ||
      (t.indexOf('Changelog')>=0 && t.indexOf('更新')>=0)
    );
  }
  function removePopup(){
    try{
      var all=[].slice.call(document.body ? document.body.querySelectorAll('*') : []);
      for(var i=0;i<all.length;i++){
        var el=all[i];
        var txt=el.innerText || el.textContent || '';
        if(!badText(txt)) continue;
        var target=el;
        for(var j=0;j<10 && target && target.parentElement;j++){
          var cs=getComputedStyle(target);
          var r=target.getBoundingClientRect();
          var covers=(cs.position==='fixed'||cs.position==='absolute') && r.width>window.innerWidth*0.55 && r.height>window.innerHeight*0.25;
          if(covers || (target.className && String(target.className).indexOf('z-')>=0)) break;
          target=target.parentElement;
        }
        if(target && target !== document.body && target !== document.documentElement){ target.remove(); return true; }
        el.remove(); return true;
      }
    }catch(e){}
    return false;
  }
  var css=document.createElement('style');
  css.textContent='[data-xiaoxing-force-hide], .xiaoxing-force-hide{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}';
  document.documentElement.appendChild(css);
  var obs=new MutationObserver(function(){ removePopup(); });
  function start(){ if(document.body){ obs.observe(document.body,{childList:true,subtree:true,characterData:true}); removePopup(); } }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  setInterval(removePopup,200);
})();
</script>

    <script>
      // XiaoxingOS hard cleanup: remove legacy Sully character from old local data before React boots.
      (function(){
        var OLD_RE = /sully|preset-sully|电波系黑客猫猫|AI助理/i;
        function scrubValue(v){
          if (typeof v !== 'string') return v;
          if (!OLD_RE.test(v)) return v;
          try {
            var data = JSON.parse(v);
            var changed = false;
            function walk(x){
              if (Array.isArray(x)) {
                for (var i=x.length-1;i>=0;i--) {
                  var it=x[i] || {};
                  var id=String(it.id||'').toLowerCase();
                  var name=String(it.name||'').toLowerCase();
                  var desc=String(it.description||'');
                  if (id.indexOf('sully')>=0 || name==='sully' || name.indexOf('sully')>=0 || desc.indexOf('电波系黑客猫猫')>=0 || desc.indexOf('AI助理')>=0) { x.splice(i,1); changed=true; continue; }
                  walk(it);
                }
              } else if (x && typeof x==='object') {
                Object.keys(x).forEach(function(k){ walk(x[k]); });
              }
            }
            walk(data);
            return changed ? JSON.stringify(data) : v;
          } catch(e) { return v; }
        }
        try {
          for (var i=localStorage.length-1;i>=0;i--) {
            var k=localStorage.key(i); var v=localStorage.getItem(k);
            if (OLD_RE.test(k) || OLD_RE.test(v||'')) {
              var nv=scrubValue(v);
              if (nv!==v) localStorage.setItem(k,nv);
              if (/sully/i.test(k) && nv===v) localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        try {
          if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs){
              dbs.forEach(function(info){
                if (!info || !info.name) return;
                var open=indexedDB.open(info.name);
                open.onsuccess=function(){
                  var db=open.result;
                  Array.prototype.slice.call(db.objectStoreNames).forEach(function(storeName){
                    try {
                      var tx=db.transaction(storeName,'readwrite');
                      var store=tx.objectStore(storeName);
                      var cursor=store.openCursor();
                      cursor.onsuccess=function(ev){
                        var cur=ev.target.result; if(!cur) return;
                        var val=cur.value || {};
                        var raw=''; try{ raw=JSON.stringify(val); }catch(e){}
                        var id=String(val.id||val._id||'').toLowerCase();
                        var name=String(val.name||val.title||'').toLowerCase();
                        var desc=String(val.description||'');
                        if (id.indexOf('sully')>=0 || name==='sully' || name.indexOf('sully')>=0 || desc.indexOf('电波系黑客猫猫')>=0 || desc.indexOf('AI助理')>=0 || /preset-sully-v2/i.test(raw)) {
                          cur.delete();
                        }
                        cur.continue();
                      };
                    } catch(e) {}
                  });
                };
              });
            }).catch(function(){});
          }
        } catch(e) {}
      })();
    </script>
